<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel ="stylesheet" href="style.css">
    <title>Simon Game</title>
</head>
<body>
    <div id="preloader">
        <img src="pre.svg" style="height: 80px;">
        <p>Loading...</p>
    </div>
    <h1>Simon Game</h1>
    <h2>Press any key to start the game</h2>


    <div class="intro-screen" id="content" style="display: none;">

        <h1 id="intro-h1">Simon Game</h1>

        <img src="simon-game-card.png" alt="Simon Game" class="intro-img" />
     
        <p class="word" id="intro-p">Follow the pattern of lights and sounds<br>
            for as long as you can... if you can!
        </p>
        <br><br>

        <button id="play-btn">:: PLAY ::</button>
    </div>



    <div class="btn-container">

        <div class="line-one">
        <div class="btn red" type="button" id="red"></div>
        <div class="btn yellow" type="button" id="yellow"></div>
        </div>

        <div class="line-two">
        <div class="btn green" type="button" id="green"></div>
        <div class="btn purple" type="button" id="purple"></div>
        </div>
    </div>
  <script src="script.js"></script>  
</body>
</html>
